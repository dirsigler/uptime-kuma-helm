suite: test bundle tailscale secret
templates:
  - secret-tailscale.yaml
tests:
  - it: should not render secret when tailscale is disabled
    set:
      global:
        tailscale:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render secret with auth key when enabled
    set:
      global:
        tailscale:
          enabled: true
          auth: tskey-abc123
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-tailscale-auth
      - equal:
          path: stringData.TS_AUTHKEY
          value: tskey-abc123

  - it: should render secret even when auth is empty
    set:
      global:
        tailscale:
          enabled: true
          auth: ""
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.TS_AUTHKEY
          value: ""
